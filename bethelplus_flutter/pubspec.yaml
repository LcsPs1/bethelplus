name: bethelplus
description: Application chrétienne de prière, Bible et méditation
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Navigation
  go_router: ^14.0.0

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Base de données locale (équivalent Room)
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.3
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # Réseau / API (équivalent Retrofit)
  dio: ^5.4.3+1

  # Backend Cloud & Authentification
  supabase_flutter: ^2.8.0

  # TTS (Text-to-Speech)
  flutter_tts: ^4.1.0

  # Audio playback
  audioplayers: ^6.0.0

  # Notifications locales
  flutter_local_notifications: ^17.2.2

  # Alarmes
  alarm: ^4.1.0

  # Stockage clé/valeur
  shared_preferences: ^2.3.2

  # Utilitaires
  intl: ^0.20.3
  url_launcher: ^6.3.0
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  lottie: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  drift_dev: ^2.18.0
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/fonts/
    - assets/images/
    - assets/lottie/
    - assets/audio/
    - assets/bible/

name: Build iOS IPA & TestFlight

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: 🍏 Build iOS IPA (Flutter)
    runs-on: macos-14

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🦋 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.x'
          channel: 'stable'
          cache: true

      - name: 📦 Install Flutter Dependencies
        working-directory: bethelplus_flutter
        run: flutter pub get

      - name: 🧪 Run Tests & Analysis
        working-directory: bethelplus_flutter
        run: |
          flutter analyze --no-fatal-infos
          flutter test

      - name: 🛠️ Setup CocoaPods
        working-directory: bethelplus_flutter/ios
        run: pod install

      - name: 🏗️ Build iOS (No Codesign / Archive)
        working-directory: bethelplus_flutter
        run: |
          flutter build ios --release --no-codesign

      - name: 📦 Package Unsigned IPA
        working-directory: bethelplus_flutter
        run: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r BethelPlus_unsigned.ipa Payload
          cd ../../..

      - name: 📤 Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BethelPlus-iOS-IPA
          path: bethelplus_flutter/build/ios/iphoneos/BethelPlus_unsigned.ipa
          retention-days: 14
